<!DOCTYPE html>
<html>
<head>
<style>
  .wave span {
    display: inline-block;
    font-family: Arial, sans-serif;
  }
  .s1 { font-size: 32px; transform: translateY(0px); }
  .s2 { font-size: 26px; transform: translateY(-6px); }
  .s3 { font-size: 20px; transform: translateY(-10px); }
  .s4 { font-size: 26px; transform: translateY(-6px); }
  .s5 { font-size: 32px; transform: translateY(0px); }
  .s6 { font-size: 26px; transform: translateY(6px); }
  .s7 { font-size: 20px; transform: translateY(10px); }
  .s8 { font-size: 26px; transform: translateY(6px); }
</style>
</head>
<body>
  <p class="wave">
    <span class="s1">O</span><span class="s2">O</span><span class="s3">O</span><span class="s4">O</span><span class="s5">O</span><span class="s6">O</span><span class="s7">O</span><span class="s8">O</span>
    <span class="s1">O</span><span class="s2">O</span><span class="s3">O</span><span class="s4">O</span><span class="s5">O</span><span class="s6">O</span><span class="s7">O</span><span class="s8">O</span>
    <span class="s1">O</span>
  </p>
</body>
</html>
